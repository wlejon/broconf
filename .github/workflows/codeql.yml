name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# What broconf parses is not only its own: settings files any process (or a
# user with a text editor) can write, and D-Bus signals from anyone on the
# session bus. The INI and value parsers index into that text, so
# out-of-bounds reads, unchecked conversions and path handling are the
# realistic bugs, which the C++ security queries look for.
#
# Three analyses, because each change notifier compiles only on its own OS:
# Linux (sd-bus + inotify), Windows (directory watch) and macOS (kqueue), each
# with the portable core. broconf has no vendored code; the only sibling code is
# bronze/brass for broconf_api, pre-built ahead of the trace.
jobs:
  analyze:
    name: Analyze C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    steps:
      - uses: actions/checkout@v7
        with:
          path: broconf

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libsystemd-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S broconf -B build -DBROCONF_BUILD_TESTS=OFF
          else
            cmake -S broconf -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBROCONF_BUILD_TESTS=OFF
          fi

      # bronze (and brass through it), for broconf_api, is analysed by its own
      # workflows. Anything built before `init` is never extracted, so building
      # it here keeps it out of this database.
      - name: Pre-build bronze (outside the traced build)
        run: cmake --build build --config Debug --parallel 4 --target bronze_runtime_shared

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          source-root: broconf
          queries: security-extended

      - name: Build (traced)
        run: cmake --build build --config Debug --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp/os:${{ runner.os }}
